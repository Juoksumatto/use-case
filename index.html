<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Äänestys sivu</title>
    <link rel="stylesheet" href="tyyli.css">
</head>
<body>
    <h1>Äänestys sivu.</h1>
    <button onclick="Luoäännestys()" class="luo" id="luo" >Luo äännestys</button>
    <button onclick="Poistaäännestys()" class="poista" id="poista" >Poista äännestys</button>
    <button onclick="äänestykset()" class="äänestykset" id="äänestykset" >Näytä äänestykset</button>
    <br><br>
    <div id="Äänestyslista" ></div>
<script>
    function Luoäännestys() {
        var salasana = prompt("Anna salasana:");
        if (salasana === "ylläpitäjä123") {
            var kysymys = prompt("Anna äännestyskysymys:");
            var kuinkamonta = prompt("Kuinka monta vaihtoehtoa:");
                kuinkamonta = Number(kuinkamonta);
                if (kuinkamonta < 2 || isNaN(kuinkamonta)) {
                    alert("Anna numero, joka on suurempi kuin 1.")
                    return;
                } else {
                    var vaihtoehdot = [];
                    for (var i = 0; i < kuinkamonta; i++) {
                        var vaihtoehto = prompt("Anna vaihtoehto " + (i + 1) + ":");
                        vaihtoehdot.push(vaihtoehto);
                    if (!vaihtoehto) {
                        alert("Vaihtoehdot eivät voi olla tyhjiä.");
                        return;
                    }}     
                    }
                    var äännestys = {
                        kysymys: kysymys,
                        vaihtoehdot: vaihtoehdot,
                        votes: new Array(vaihtoehdot.length).fill(0)
                    };

                    
                    var kaikkiÄänestykset = JSON.parse(localStorage.getItem("äänestykset")) || [];
                    kaikkiÄänestykset.push(äännestys);
                    localStorage.setItem("äänestykset", JSON.stringify(kaikkiÄänestykset));
                    alert("Äännestys luotu.");
                    document.getElementById("Äänestyslista").innerHTML = "Luotu äänestys: " + kysymys;
                }    
        else{
            alert("Väärä salasana.");
            return;       
        }
        }
        
    function Poistaäännestys() {
        var salasana = prompt("Anna salasana:");
        if (salasana === "ylläpitäjä123") {
            var kysymys = prompt("Anna poistettavan äännestyksen nimi:")
            var kaikkiÄänestykset = JSON.parse(localStorage.getItem("äänestykset")) || [];
            var uudetÄänestykset = kaikkiÄänestykset.filter(function(äänestys) {
                return äänestys.kysymys !== kysymys
            });
            localStorage.setItem("äänestykset", JSON.stringify(uudetÄänestykset));
            document.getElementById("Äänestyslista").innerHTML = "Poistettu äänestys: " + kysymys;
            alert("Äänestys poistettu.");
        } else {
            alert("Väärä salasana.");
        }
    }
    function äänestykset() {
        
        var äänestykset = JSON.parse(localStorage.getItem("äänestykset")) || [];
        var container = document.getElementById("Äänestyslista");

        if (äänestykset.length === 0) {
            container.innerHTML = "Ei yhtään äänestystä.";
            return;
        }

        var html = "";
        äänestykset.forEach(function(äänestys, index) {
            html += "<h3>" + (index + 1) + ". " + äänestys.kysymys + "</h3>";
            html += "<form id='poll-" + index + "'>";
            äänestys.vaihtoehdot.forEach(function(vaihtoehto, vIndex) {
                var count = äänestys.votes ? äänestys.votes[vIndex] : 0;
                html += "<label>";
                html += "<input type='radio' name='option-" + index + "' value='" + vIndex + "'>";
                html += vaihtoehto + " (" + count + " ääntä)</label><br>";
            });
            html += "<button type='button' class'äänestä' onclick='vote(" + index + ")'>Äänestä</button>";

            html += "</form><hr>";
        });

        container.innerHTML = html;
    }
    function vote(pollIndex) {
        var kaikkiÄänestykset = JSON.parse(localStorage.getItem("äänestykset")) || [];
        var poll = kaikkiÄänestykset[pollIndex];
        var selected = document.querySelector("input[name='option-" + pollIndex + "']:checked");
        if (!selected) {
            alert("Valitse vaihtoehto ennen äänestämistä!");
            return;
        }
        var choice = parseInt(selected.value);
        if (!poll.votes) {
            poll.votes = new Array(poll.vaihtoehdot.length).fill(0);

        }
        poll.votes[choice]++;
        kaikkiÄänestykset[pollIndex] = poll;
        localStorage.setItem("äänestykset", JSON.stringify(kaikkiÄänestykset));

        alert("Ääni tallennettu: " + poll.vaihtoehdot[choice]);
        äänestykset();
}

</script>
</body>
</html>
